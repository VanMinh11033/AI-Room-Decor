services:
  mysql:
    image: mysql:8.4
    container_name: ai-room-decor-mysql
    environment:
      MYSQL_DATABASE: ai_room_decor
      MYSQL_USER: ai_room_user
      MYSQL_PASSWORD: ai_room_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-room-decor-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://ai_room_user:ai_room_password@mysql:3306/ai_room_decor?charset=utf8mb4
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
    container_name: ai-room-decor-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:

