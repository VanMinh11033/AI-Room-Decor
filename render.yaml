services:
  - type: web
    name: ai-room-decor-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_BACKEND
        value: cloudinary
      - key: VISION_PROVIDER
        value: gemini
      - key: IMAGE_PROVIDER
        value: cloudflare
      - key: IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-2-dev"
      - key: CLOUDFLARE_IMAGE_TIMEOUT_SECONDS
        value: "95"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
